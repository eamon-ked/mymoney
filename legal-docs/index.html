<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nokael Money - Legal Documents</title>
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#F7F6F1">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23354E3C'/%3E%3Cpath d='M8 23C8 13 14 8 25 7c0 11-5 17-13 17-1.500 0-3-.3-4-1Zm0 2c2-6 6-10 11-12' fill='none' stroke='%23F7F6F1' stroke-width='1.800' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <style>
        :root {
            --green: #354E3C;
            --green-deep: #26382C;
            --cream: #F7F6F1;
            --ink: #26382C;
            --muted: #586A5D;
            --line: #DEDFD4;
            --tint: #ECEEE3;
            --serif: ui-serif, "New York", "Iowan Old Style", Georgia, "Times New Roman", serif;
            --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        *, *::before, *::after { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0;
            background: var(--cream);
            color: var(--ink);
            font-family: var(--sans);
            font-size: 17px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 32px 24px calc(40px + env(safe-area-inset-bottom));
        }
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            color: var(--green);
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
        }
        .brand svg { width: 22px; height: 22px; }
        h1, h2 {
            color: var(--green);
            font-family: var(--serif);
            font-weight: 500;
        }
        h1 {
            margin: 12px 0 16px;
            font-size: clamp(36px, 7vw, 50px);
            line-height: 1.08;
            letter-spacing: -.015em;
            text-wrap: balance;
        }
        h2 {
            margin: 40px 0 8px;
            font-size: 25px;
            line-height: 1.25;
        }
        h3 {
            margin: 24px 0 4px;
            color: var(--green);
            font-size: 17px;
            font-weight: 600;
        }
        p, ul { margin: 0 0 14px; }
        ul { padding-left: 22px; }
        li { margin-bottom: 6px; }
        a {
            color: var(--green);
            overflow-wrap: anywhere;
            text-underline-offset: 3px;
        }
        a:focus-visible {
            outline: 2px solid var(--green);
            outline-offset: 3px;
            border-radius: 4px;
        }
        .back-link {
            display: table;
            margin-top: 44px;
            color: var(--muted);
            font-size: 15px;
            text-decoration: none;
        }
        .back-link:hover { color: var(--green); text-decoration: underline; }
        .summary {
            padding: 16px 20px;
            background: var(--tint);
            border-radius: 12px;
        }
        table {
            width: 100%;
            margin: 12px 0 16px;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px 12px 10px 0;
            border-bottom: 1px solid var(--line);
            text-align: left;
            vertical-align: top;
        }
        th { color: var(--green); font-size: 15px; font-weight: 600; }
        .doc-link {
            display: block;
            margin: 12px 0;
            padding: 15px 20px;
            background: var(--green);
            border-radius: 12px;
            color: var(--cream);
            font-weight: 500;
            text-decoration: none;
        }
        .doc-link:hover { background: var(--green-deep); }
        .footer {
            margin-top: 48px;
            padding-top: 20px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 15px;
        }
        .footer p { margin: 0 0 4px; }
    </style>
</head>
<body>
    <div class="container">
        <a class="brand" href="https://money.nokael.com/">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 18.500C4 10 10 4.500 20.500 4c.5 10.500-4.500 16-11.500 16-1.600 0-3-.5-4-1.500Z"/><path d="M4 21c2-6 5.500-9.500 10.500-11.500"/></svg>
            Nokael Money
        </a>
        <a class="back-link" href="https://money.nokael.com/">← Back to Nokael Money</a>
        <h1>Legal Documents</h1>
        
        <a href="privacy-policy.html" class="doc-link">Privacy Policy</a>
        <a href="terms-of-service.html" class="doc-link">Terms of Use</a>
        
        <div class="footer">
            <p>© 2026 Nokael. All rights reserved.</p>
            <p>Contact: <a href="mailto:money@nokael.com">money@nokael.com</a></p>
        </div>
    </div>
</body>
</html>
